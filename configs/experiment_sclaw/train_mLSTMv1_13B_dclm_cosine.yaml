# @package _global_
defaults:
  - /data@data_train.ds1: dclm_arrayrecord_train
  - /data@data_eval.ds1: dclm_arrayrecord_eval_preprocessed
  # - /data@data_eval.ds2: slimpajama_627B_arrayrecord_eval_preprocessed
  - override /parallel: mLSTMv1_7B # uses FSDP within a single node
  - override /model: mLSTMv1_default
  - override /optimizer: adamw
  - override /scheduler: cosine_decay
  - override /hydra/launcher: slurm_launcher
  - _self_

# specify the deltas from the defaults:
task_name: sclaw
batch_size_per_device: 1
context_length: 8192
num_epochs: 1000
num_train_steps: 100_000 #95_000
lr: 4e-4

scheduler:
  warmup_steps: 3000
  cooldown_steps: 1000 #2000

trainer:
  gradient_accumulate_steps: 1
  check_val_every_n_steps: 2000
  log_logit_stats: true
  log_intermediates: true

checkpointing:
  monitor: dclm_perplexity

data_train:
  ds1:
    tokenizer_path: "EleutherAI/gpt-neox-20b"
#     batch_rampup_factors:
#       0: 0.25
#       1_000: 0.5
#       2_000: 1.0

data_eval:
  ds1:
    tokenizer_path: "EleutherAI/gpt-neox-20b"
  # ds2:
  #   tokenizer_path: "EleutherAI/gpt-neox-20b"

model:
  name: mLSTMv1_13B

  reset_at_document_boundaries: true
  vocab_size: -1
  backend: "triton_kernels"
  backend_name: "chunkwise--triton_limit_chunk" #"chunkwise--triton_xl_chunk" #"chunkwise--triton_limit_chunk"
  chunk_size: 64 #256 #64

  num_blocks: 40
  num_heads: 10
  embedding_dim: 5120

  cell_norm_type_v1: rmsnorm #rmsnorm

profiling:
  # Not profiling to reduce time and potential failure points.
  profile_every_n_minutes: -1

base_dir: /nfs-gpu/xlstm/outputs_beck
logging_name: ${data_train.ds1.name}_${model.name}_ctx${context_length}_lr${lr}_steps${num_train_steps}

# Run command:
# PYTHONPATH=. python scripts/training/train_with_hydra.py +experiment_sclaw=train_mLSTMv1_2.7B_dclm_cosine
hydra:
  launcher:
    nodes: 32
    additional_parameters: {
      "gpu-bind": "closest",
      "wait-all-nodes": "1",
      "time": "21-00:00:00",
      "exclusive": "",
    }
  mode: MULTIRUN
  # this will start the runs locally and serially, i.e. submitit will wait until the first jobs is done
  # sweeper:
  #   params:
  #     lr: 7e-4, 1e-3
