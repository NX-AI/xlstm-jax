# @package _global_
defaults:
  - /data@data_train.ds1: dclm_arrayrecord_train
  - /data@data_eval.ds1: dclm_arrayrecord_eval
  - override /parallel: mLSTMv1_1.3B # use this for no FSDP (pure dp)
  - override /model: mLSTMv1_default
  - override /optimizer: adamw
  - override /scheduler: cosine_decay
  - override /hydra/launcher: slurm_launcher
  - _self_

# specify the deltas from the defaults:
task_name: mlstmkernels
batch_size_per_device: 16
context_length: 4096
num_epochs: 1000
num_train_steps: 36_000 #95_000
lr: 3e-3

scheduler:
  warmup_steps: 750
  cooldown_steps: 1000 #2000

trainer:
  gradient_accumulate_steps: 1
  check_val_every_n_steps: 1000
  log_logit_stats: true
  log_intermediates: true

checkpointing:
  monitor: dclm_perplexity

data_train:
  ds1:
    tokenizer_path: "EleutherAI/gpt-neox-20b"

data_eval:
  ds1:
    tokenizer_path: "EleutherAI/gpt-neox-20b"

model:
  name: mLSTMv1_160M

  reset_at_document_boundaries: true
  vocab_size: -1
  backend: "triton_kernels"
  backend_name: "chunkwise--triton_limit_chunk" # "chunkwise--triton_limit_chunk", "chunkwise--triton_xl_chunk_siging", "parallel--native_siging_autograd"

  chunk_size: 64
  normalize_siging: false # only used for siging kernels

  num_blocks: 12
  num_heads: 6
  embedding_dim: 768

  igate_bias_init_range: -10.0
  igate_preact_fixed_to: null

  cell_norm_type_v1: rmsnorm
  cell_norm_eps: 1e-6

  backend_eps: 1e-6

profiling:
  # Not profiling to reduce time and potential failure points.
  profile_every_n_minutes: -1

base_dir: /nfs-gpu/xlstm/outputs_beck
logging_name: ${data_train.ds1.name}_${model.name}_igexps_ctx${context_length}_lr${lr}_steps${num_train_steps}_bname${model.backend_name}_cs${model.chunk_size}_nh${model.num_heads}_igpf${model.igate_preact_fixed_to}_igpb${model.igate_bias_init_range}_nt${model.cell_norm_type_v1}_ne${model.cell_norm_eps}_nsig${model.normalize_siging}_be${model.backend_eps}

logger:
  wb_tags:
    - ${task_name}
    - ${model.backend_name}
    - backendeps

# Run command:
# PYTHONPATH=. python scripts/training/train_with_hydra.py +experiment_sclaw=train_mLSTMv1_160M_dclm_cosine
hydra:
  launcher:
    nodes: 1
    additional_parameters: {
      "gpu-bind": "closest",
      "wait-all-nodes": "1",
      "time": "21-00:00:00",
      "exclude": "compute-permanent-node-72",
    }
  mode: MULTIRUN
  # this will start the runs locally and serially, i.e. submitit will wait until the first jobs is done
  # sweeper:
  #   params:
  #     model.igate_bias_init_range: 0.0 #-10.0, -5.0, -2.0
  #     # model.cell_norm_eps: 1e-8, 1e-6, 1e-4, 1e-2
  #     model.backend_eps: 1e-6, 0.0
