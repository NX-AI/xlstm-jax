# @package _global_
defaults:
  - /data@data_train.ds1: dclm_arrayrecord_train
  - /data@data_eval.ds1: dclm_arrayrecord_eval_preprocessed # dclm_arrayrecord_eval (not preprocessed, use for sequence_lengths != 8192)
  # - /data@data_eval.ds2: slimpajama_627B_arrayrecord_eval_preprocessed
  - override /parallel: mLSTMv1_7B # uses FSDP within a single node
  - override /model: mLSTMv1_default
  - override /optimizer: adamw
  - override /scheduler: cosine_decay
  - override /hydra/launcher: slurm_launcher
  - _self_

# specify the deltas from the defaults:
task_name: mlstmkernels_add_7B
batch_size_per_device: 4
context_length: 8192
num_epochs: 1000
num_train_steps: 76_000 #95_000
lr: 5e-4

scheduler:
  warmup_steps: 3000
  cooldown_steps: 1000 #2000

trainer:
  gradient_accumulate_steps: 1
  check_val_every_n_steps: 1000
  log_logit_stats: true
  log_intermediates: true
  seed: 42

checkpointing:
  monitor: dclm_perplexity

data_train:
  ds1:
    tokenizer_path: "EleutherAI/gpt-neox-20b"
    batch_rampup_factors:
      0: 0.25
      1_000: 0.5
      2_000: 1.0
data_eval:
  ds1:
    tokenizer_path: "EleutherAI/gpt-neox-20b"
  # ds2:
  #   tokenizer_path: "EleutherAI/gpt-neox-20b"

optimizer:
  grad_clip_norm: 0.5 # TODO set to 1.0

model:
  name: mLSTMv1_7B

  reset_at_document_boundaries: true
  vocab_size: -1
  backend: "triton_kernels"
  backend_name: "chunkwise--triton_xl_chunk_siging" #"chunkwise--triton_xl_chunk_siging" #"chunkwise--triton_xl_chunk" #"chunkwise--triton_limit_chunk"
  chunk_size: 128 #64
  normalize_siging: false

  num_blocks: 32
  num_heads: 8
  embedding_dim: 4096

  igate_bias_init_range: -10.0
  igate_preact_fixed_to: null

  cell_norm_type_v1: layernorm #rmsnorm #layernorm #rmsnorm # TODO try rmsnorm

profiling:
  # Not profiling to reduce time and potential failure points.
  profile_every_n_minutes: -1

base_dir: /nfs-gpu/xlstm/outputs_beck
logging_name: ${data_train.ds1.name}_${model.name}_ctx${context_length}_lr${lr}_steps${num_train_steps}_bname${model.backend_name}_normsig${model.normalize_siging}_cs${model.chunk_size}_igp${model.igate_preact_fixed_to}_nh${model.num_heads}_s${trainer.seed}_${model.cell_norm_type_v1}_gc${optimizer.grad_clip_norm}

logger:
  wb_tags:
    - ${task_name}
    - ${model.backend_name}

# Run command:
# PYTHONPATH=. python scripts/training/train_with_hydra.py +experiment_sclaw=train_mLSTMv1_1.4B_dclm_cosine
hydra:
  launcher:
    nodes: 8
    additional_parameters: {
      "gpu-bind": "closest",
      "wait-all-nodes": "1",
      "time": "21-00:00:00",
      "exclusive": "",
    }
  mode: MULTIRUN
  # this will start the runs locally and serially, i.e. submitit will wait until the first jobs is done
  # sweeper:
  #   params:
  #     # lr: 7e-4, 1e-3
  #     model.normalize_siging: false, true
  #     model.num_heads: 8
